function render(){const q=questions[idx];const pct=Math.round((idx/Math.max(1,questions.length-1))*100);document.getElementById('app').innerHTML=`<h1>DHA Set 19 — Live MCQ Exam</h1><div class="sub">Source questions are kept separate for this set. The quiz uses answers visibly marked in the scan.</div><div class="top"><span>Question ${idx+1} of ${questions.length}</span><span>Source Q. ${q.source}</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="q">${esc(q.stem)}</div>${['A','B','C','D'].map(x=>`<button class="${answers[idx]===x?'sel':''}" onclick="choose('${x}')"><b>${x}.</b> ${esc(q.options[x])}</button>`).join('')}<div class="nav"><button onclick="prev()">← Previous</button><button onclick="next()">Next →</button></div><button onclick="submitExam()" style="text-align:center;margin-top:14px">Submit Exam</button>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function choose(x){answers[idx]=x;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(idx<questions.length-1){idx++;render()}}function submitExam(){if(!confirm('Submit the exam now?'))return;submitted=true;showResult()}
function showResult(){let scored=0,correct=0,wrong=0,unanswered=0,unscored=0;questions.forEach((q,i)=>{if(!q.answer){unscored++;return};scored++;if(!answers[i])unanswered++;else if(answers[i]===q.answer)correct++;else wrong++});let pct=scored?Math.round(correct/scored*100):0;let rows=questions.map((q,i)=>{let cls=!q.answer?'':answers[i]===q.answer?'correct':'wrong';return `<div class="r ${cls}"><b>Q${i+1} — Source ${q.source}</b><br>${esc(q.stem)}<br><small>Your answer: ${answers[i]||'Unanswered'} · Correct: ${q.answer||'Not reliably marked in scan'}</small></div>`}).join('');document.getElementById('app').innerHTML=`<h1>DHA Set 19 — Live MCQ Exam</h1><div class="result"><b>Score: ${correct} / ${scored} (${pct}%)</b><br>Correct: ${correct} · Wrong: ${wrong} · Unanswered: ${unanswered} · Unscored: ${unscored}</div><div class="review">${rows}</div><div class="restart"><button onclick="location.reload()" style="text-align:center">Restart Exam</button></div>`}
render();</script></body></html>
